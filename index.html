<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova – KI-Assistent</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --blue: #00c8ff;
  --blue-dim: rgba(0,200,255,0.4);
  --purple: #8b5cf6;
  --cyan: #00e5ff;
  --orange: #f59e0b;
  --green: #10b981;
  --white: #e8f4ff;
  --bg: #020a12;
}

body {
  background: var(--bg);
  color: var(--white);
  font-family: 'Exo 2', sans-serif;
  height: 100vh;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* ===== BACKGROUND ===== */
#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.space-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 70% 50%, rgba(20,0,60,0.8) 0%, transparent 70%),
    radial-gradient(ellipse 50% 80% at 85% 30%, rgba(0,30,80,0.6) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 15% 80%, rgba(0,10,40,0.5) 0%, transparent 50%),
    linear-gradient(135deg, #010810 0%, #040d1a 40%, #030810 100%);
}

/* Planet / dark sphere on right */
.planet {
  position: fixed;
  right: -8vw;
  top: -5vh;
  width: 55vw;
  height: 110vh;
  border-radius: 50%;
  background: radial-gradient(ellipse at 35% 40%, rgba(5,15,40,0.95) 0%, rgba(2,5,18,1) 60%, rgba(0,2,10,1) 100%);
  box-shadow: -60px 0 120px rgba(0,80,200,0.15), inset 0 0 80px rgba(0,30,100,0.3);
  z-index: 0;
}

/* Scanline corners */
.corner { position: fixed; width: 40px; height: 40px; z-index: 20; opacity: 0.7; }
.corner-tl { top: 14px; left: 14px; border-top: 1.5px solid var(--blue); border-left: 1.5px solid var(--blue); }
.corner-tr { top: 14px; right: 14px; border-top: 1.5px solid var(--blue); border-right: 1.5px solid var(--blue); }
.corner-bl { bottom: 14px; left: 14px; border-bottom: 1.5px solid var(--blue); border-left: 1.5px solid var(--blue); }
.corner-br { bottom: 14px; right: 14px; border-bottom: 1.5px solid var(--blue); border-right: 1.5px solid var(--blue); }

/* ===== STATUS BAR ===== */
#statusbar {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 48px;
  padding: 12px 60px;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  color: rgba(0,200,255,0.7);
  border-bottom: 1px solid rgba(0,200,255,0.1);
  background: rgba(0,5,15,0.6);
  backdrop-filter: blur(10px);
}

.status-brand {
  display: flex; align-items: center; gap: 8px;
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 0 8px var(--blue);
  animation: pulse 2s ease-in-out infinite;
}
#clock, #date-display {
  min-width: 80px; text-align: center;
}
.status-neural { color: rgba(0,255,200,0.7); }

/* ===== MAIN LAYOUT ===== */
#main {
  position: relative;
  z-index: 5;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}

/* ===== NOVA TITLE ===== */
#nova-title {
  text-align: center;
  padding: 20px 0 8px;
  position: relative;
  z-index: 10;
}

.nova-wordmark {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(3.5rem, 8vw, 6rem);
  font-weight: 900;
  letter-spacing: 0.25em;
  color: #fff;
  text-shadow:
    0 0 40px rgba(0,200,255,0.3),
    0 0 80px rgba(0,150,255,0.15);
  line-height: 1;
}

.nova-tagline {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  color: var(--blue);
  margin-top: 6px;
  text-transform: uppercase;
  opacity: 0.85;
}

.nova-status-line {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.25em;
  color: rgba(200,230,255,0.4);
  margin-top: 4px;
}

/* ===== ORBITAL RING ===== */
#ring-container {
  position: relative;
  width: min(340px, 55vw);
  height: min(340px, 55vw);
  margin: 0 auto;
  flex-shrink: 0;
}

#ring-canvas {
  width: 100%;
  height: 100%;
}

/* Status pill below ring */
#nova-state {
  text-align: center;
  margin-top: -10px;
  position: relative;
  z-index: 10;
}

.state-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 20px;
  border: 1px solid rgba(0,200,255,0.3);
  border-radius: 20px;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: rgba(0,200,255,0.9);
  background: rgba(0,30,60,0.5);
  backdrop-filter: blur(10px);
}

.state-pill .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 0 6px var(--blue);
  animation: pulse 1.5s ease-in-out infinite;
}

/* ===== SETUP BANNER ===== */
#setup-banner {
  position: fixed;
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  background: rgba(0,15,35,0.95);
  border: 1px solid rgba(0,200,255,0.3);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.8rem;
  color: rgba(200,230,255,0.7);
  backdrop-filter: blur(20px);
  white-space: nowrap;
  box-shadow: 0 0 40px rgba(0,100,200,0.2);
}

#setup-banner input {
  background: rgba(0,30,60,0.8);
  border: 1px solid rgba(0,200,255,0.3);
  color: var(--white);
  padding: 7px 14px;
  font-family: 'Exo 2', sans-serif;
  font-size: 0.8rem;
  outline: none;
  width: 280px;
}
#setup-banner input:focus { border-color: var(--blue); }
#setup-banner button {
  background: var(--blue);
  border: none;
  color: #000;
  padding: 7px 16px;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  cursor: pointer;
}

/* ===== CHAT OVERLAY ===== */
#chat-overlay {
  position: absolute;
  inset: 0;
  z-index: 8;
  overflow-y: auto;
  padding: 20px 40px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  pointer-events: none;
  scroll-behavior: smooth;
}

#chat-overlay.has-messages {
  pointer-events: auto;
  background: rgba(2,10,20,0.85);
  backdrop-filter: blur(6px);
}

#chat-overlay::-webkit-scrollbar { width: 3px; }
#chat-overlay::-webkit-scrollbar-thumb { background: rgba(0,200,255,0.15); }

.msg {
  display: flex;
  gap: 10px;
  max-width: 680px;
  animation: msgIn 0.25s ease;
  opacity: 0;
  animation-fill-mode: forwards;
}
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.nova { align-self: flex-start; }

.msg-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.6rem; font-family: 'Orbitron', sans-serif; font-weight: 700;
  flex-shrink: 0; margin-top: 4px;
}
.msg.user .msg-avatar {
  background: rgba(0,100,200,0.3);
  border: 1px solid rgba(0,200,255,0.3);
  color: var(--blue);
}
.msg.nova .msg-avatar {
  background: rgba(0,200,255,0.1);
  border: 1px solid rgba(0,200,255,0.2);
  color: var(--blue);
  font-size: 0.55rem;
}

.msg-bubble {
  padding: 10px 16px;
  line-height: 1.6;
  font-size: 0.88rem;
  font-weight: 300;
}
.msg.user .msg-bubble {
  background: rgba(0,80,160,0.25);
  border: 1px solid rgba(0,200,255,0.2);
  color: var(--white);
  border-radius: 2px;
}
.msg.nova .msg-bubble {
  background: rgba(0,20,45,0.8);
  border: 1px solid rgba(0,200,255,0.1);
  border-left: 2px solid var(--blue);
  color: rgba(210,240,255,0.9);
  border-radius: 0 2px 2px 0;
}

/* Typing dots */
.typing-dots { display: flex; gap: 5px; padding: 4px 0; align-items: center; }
.typing-dots span {
  width: 5px; height: 5px; background: var(--blue);
  border-radius: 50%; animation: dot 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

/* ===== BOTTOM SECTION ===== */
#bottom {
  position: relative;
  z-index: 10;
  padding: 10px 40px 20px;
  background: linear-gradient(to top, rgba(2,8,20,0.95) 60%, transparent);
}

/* Limit message */
#limit-msg {
  display: none;
  text-align: center;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  color: var(--orange);
  margin-bottom: 10px;
  padding: 8px;
  border: 1px solid rgba(245,158,11,0.2);
  background: rgba(245,158,11,0.05);
}

/* Input row */
.input-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(0,15,35,0.8);
  border: 1px solid rgba(0,200,255,0.2);
  padding: 10px 16px;
  backdrop-filter: blur(20px);
  margin: 0 auto;
  max-width: 720px;
  transition: border-color 0.2s;
}
.input-row:focus-within { border-color: rgba(0,200,255,0.5); }

.input-row textarea {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--white);
  font-family: 'Exo 2', sans-serif;
  font-size: 0.88rem;
  font-weight: 300;
  resize: none;
  outline: none;
  height: 24px;
  max-height: 100px;
  line-height: 1.5;
}
.input-row textarea::placeholder { color: rgba(150,200,230,0.35); }

.input-icon {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: rgba(0,200,255,0.5);
  transition: color 0.2s;
  flex-shrink: 0;
}
.input-icon:hover { color: var(--blue); }
.input-icon svg { width: 16px; height: 16px; }

#send-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--purple);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s, transform 0.15s;
  box-shadow: 0 0 16px rgba(139,92,246,0.4);
}
#send-btn:hover { background: #7c3aed; transform: scale(1.05); }
#send-btn:disabled { background: rgba(100,100,150,0.3); cursor: not-allowed; transform: none; box-shadow: none; }
#send-btn svg { width: 14px; height: 14px; color: #fff; }

/* Quick actions */
.quick-actions {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.qa-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 14px;
  background: rgba(0,15,35,0.6);
  border: 1px solid rgba(0,200,255,0.15);
  color: rgba(150,210,240,0.6);
  font-family: 'Orbitron', sans-serif;
  font-size: 0.58rem;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: all 0.2s;
}
.qa-btn:hover {
  border-color: rgba(0,200,255,0.4);
  color: rgba(0,200,255,0.9);
  background: rgba(0,30,60,0.7);
}
.qa-dot { width: 4px; height: 4px; border-radius: 50%; }

/* ===== SYSTEM STATUS (bottom left) ===== */
#sys-status {
  position: fixed;
  bottom: 80px;
  left: 30px;
  z-index: 20;
}
.sys-label {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.55rem;
  letter-spacing: 0.2em;
  color: rgba(150,180,200,0.4);
  margin-bottom: 6px;
}
.sys-value {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  color: var(--green);
}
.sys-ring {
  width: 44px; height: 44px; position: relative; margin-top: 6px;
}
.sys-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.sys-ring-track { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 2.5; }
.sys-ring-fill { fill: none; stroke: var(--green); stroke-width: 2.5; stroke-dasharray: 113; stroke-dashoffset: 0; stroke-linecap: round; }
.sys-ring-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.55rem;
  color: var(--green);
}

/* ===== MSG COUNTER (top right) ===== */
#counter-box {
  position: fixed;
  top: 50px;
  right: 30px;
  z-index: 20;
  text-align: right;
}
#counter {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  color: rgba(150,200,230,0.4);
}
#counter.warning { color: var(--orange); }
#counter.critical { color: #ff4444; }

/* ===== ANIMATIONS ===== */
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}
@keyframes dot {
  0%, 100% { transform: translateY(0); opacity: 0.4; }
  50% { transform: translateY(-4px); opacity: 1; }
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<!-- Background -->
<div class="space-bg"></div>
<canvas id="bg-canvas"></canvas>
<div class="planet"></div>

<!-- Corners -->
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<!-- Status Bar -->
<div id="statusbar">
  <div class="status-brand">
    <div class="status-dot"></div>
    NOVA SYS V3.1
  </div>
  <div id="clock">--:--:--</div>
  <div id="date-display">--.--.----</div>
  <div class="status-neural">NEURAL CORE ONLINE</div>
</div>

<!-- API Setup Banner -->
<div id="setup-banner">
  <span>🔑 GROQ API KEY:</span>
  <input type="password" id="api-key-input" placeholder="gsk_...">
  <button onclick="saveKey()">SPEICHERN</button>
</div>

<!-- Message Counter -->
<div id="counter-box">
  <div id="counter">10 / 10 Nachrichten</div>
</div>

<!-- Main Area -->
<div id="main">

  <!-- Chat Overlay (shown when messages exist) -->
  <div id="chat-overlay"></div>

  <!-- Nova Title -->
  <div id="nova-title">
    <div class="nova-wordmark">NOVA</div>
    <div class="nova-tagline">Deine KI. Dein Universum.</div>
    <div class="nova-status-line">BEREIT · NEURAL INTERFACE AKTIV</div>
  </div>

  <!-- Orbital Ring -->
  <div id="ring-container">
    <canvas id="ring-canvas"></canvas>
  </div>

  <!-- State Pill -->
  <div id="nova-state">
    <div class="state-pill" id="state-pill">
      <div class="dot"></div>
      <span id="state-text">BEREIT</span>
    </div>
  </div>

</div>

<!-- System Status -->
<div id="sys-status">
  <div class="sys-label">SYSTEM</div>
  <div class="sys-value">Operational</div>
  <div class="sys-ring">
    <svg viewBox="0 0 40 40">
      <circle class="sys-ring-track" cx="20" cy="20" r="18"/>
      <circle class="sys-ring-fill" cx="20" cy="20" r="18"/>
    </svg>
    <div class="sys-ring-label">100%</div>
  </div>
</div>

<!-- Bottom Input -->
<div id="bottom">
  <div id="limit-msg">⚡ TÄGLICHES LIMIT ERREICHT – UPGRADE AUF NOVA PREMIUM</div>

  <div class="input-row">
    <!-- Attachment icon -->
    <div class="input-icon" title="Anhang">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
      </svg>
    </div>

    <textarea id="input" placeholder="Nova fragen... z.B. ›Wie steht mein XAU Trade?‹" rows="1"></textarea>

    <!-- Mic icon -->
    <div class="input-icon" title="Sprache">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
        <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/>
      </svg>
    </div>

    <!-- Send button -->
    <button id="send-btn" onclick="sendMessage()" title="Senden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5 12 12 5 19 12"/>
      </svg>
    </button>
  </div>

  <div class="quick-actions">
    <button class="qa-btn" onclick="quickSend('Zeig mir meine Trades')">
      <div class="qa-dot" style="background:#f59e0b"></div>TRADES
    </button>
    <button class="qa-btn" onclick="quickSend('Plane meinen Tag')">
      <div class="qa-dot" style="background:#00e5ff"></div>TAG PLANEN
    </button>
    <button class="qa-btn" onclick="quickSend('Wie sieht der Markt aus?')">
      <div class="qa-dot" style="background:#10b981"></div>MARKT
    </button>
    <button class="qa-btn" onclick="quickSend('Hilf mir mit Code')">
      <div class="qa-dot" style="background:#8b5cf6"></div>CODE
    </button>
  </div>
</div>

<script>
// ===== STATE =====
const MAX_MESSAGES = 10;
let apiKey = localStorage.getItem('nova_groq_key') || '';
let msgCount = getCount();
let isTyping = false;
let conversationHistory = [];
let isSpeaking = false;

// ===== INIT =====
document.getElementById('api-key-input').value = apiKey;
if (apiKey) document.getElementById('setup-banner').style.display = 'none';
updateCounter();
startClock();

// Textarea enter
const inputEl = document.getElementById('input');
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ===== CLOCK =====
function startClock() {
  function tick() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = `${hh}:${mm}:${ss}`;
    const dd = String(now.getDate()).padStart(2,'0');
    const mo = String(now.getMonth()+1).padStart(2,'0');
    const yy = now.getFullYear();
    document.getElementById('date-display').textContent = `${dd}.${mo}.${yy}`;
  }
  tick(); setInterval(tick, 1000);
}

// ===== API KEY =====
function saveKey() {
  const key = document.getElementById('api-key-input').value.trim();
  if (!key) return;
  apiKey = key;
  localStorage.setItem('nova_groq_key', key);
  document.getElementById('setup-banner').style.display = 'none';
}

// ===== MESSAGE COUNT =====
function getCount() {
  const today = new Date().toDateString();
  const stored = JSON.parse(localStorage.getItem('nova_count') || '{"date":"","count":0}');
  if (stored.date !== today) {
    localStorage.setItem('nova_count', JSON.stringify({date: today, count: 0}));
    return 0;
  }
  return stored.count;
}
function incrementCount() {
  const today = new Date().toDateString();
  msgCount++;
  localStorage.setItem('nova_count', JSON.stringify({date: today, count: msgCount}));
  updateCounter();
}
function updateCounter() {
  const remaining = MAX_MESSAGES - msgCount;
  const el = document.getElementById('counter');
  el.textContent = `${remaining} / ${MAX_MESSAGES} Nachrichten heute`;
  el.className = '';
  if (remaining <= 3) el.classList.add('warning');
  if (remaining <= 0) el.classList.add('critical');
  if (remaining <= 0) {
    document.getElementById('send-btn').disabled = true;
    inputEl.disabled = true;
    document.getElementById('limit-msg').style.display = 'block';
  }
}

// ===== CHAT MESSAGES =====
function addMessage(role, text) {
  const overlay = document.getElementById('chat-overlay');
  if (!overlay.classList.contains('has-messages')) {
    overlay.classList.add('has-messages');
  }

  const msg = document.createElement('div');
  msg.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'nova' ? 'N' : 'DU';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  overlay.appendChild(msg);
  overlay.scrollTop = overlay.scrollHeight;
  return bubble;
}

function showTyping() {
  const overlay = document.getElementById('chat-overlay');
  const msg = document.createElement('div');
  msg.className = 'msg nova';
  msg.id = 'typing-indicator';
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = 'N';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  overlay.appendChild(msg);
  overlay.scrollTop = overlay.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function setNovaState(state) {
  const pill = document.getElementById('state-pill');
  const text = document.getElementById('state-text');
  isSpeaking = state === 'speaking';
  if (state === 'thinking') {
    text.textContent = 'VERARBEITE...';
    pill.style.borderColor = 'rgba(245,158,11,0.4)';
    pill.style.color = 'rgba(245,158,11,0.9)';
    pill.querySelector('.dot').style.background = '#f59e0b';
    pill.querySelector('.dot').style.boxShadow = '0 0 6px #f59e0b';
  } else if (state === 'speaking') {
    text.textContent = 'ANTWORTET';
    pill.style.borderColor = 'rgba(0,229,255,0.5)';
    pill.style.color = 'rgba(0,229,255,0.9)';
    pill.querySelector('.dot').style.background = '#00e5ff';
    pill.querySelector('.dot').style.boxShadow = '0 0 6px #00e5ff';
  } else {
    text.textContent = 'BEREIT';
    pill.style.borderColor = 'rgba(0,200,255,0.3)';
    pill.style.color = 'rgba(0,200,255,0.9)';
    pill.querySelector('.dot').style.background = 'var(--blue)';
    pill.querySelector('.dot').style.boxShadow = '0 0 6px var(--blue)';
  }
}

// ===== QUICK SEND =====
function quickSend(text) {
  inputEl.value = text;
  sendMessage();
}

// ===== SEND =====
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isTyping) return;

  if (!apiKey) {
    document.getElementById('setup-banner').style.display = 'flex';
    document.getElementById('api-key-input').focus();
    return;
  }
  if (msgCount >= MAX_MESSAGES) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  isTyping = true;
  document.getElementById('send-btn').disabled = true;

  addMessage('user', text);
  incrementCount();
  conversationHistory.push({ role: 'user', content: text });

  setNovaState('thinking');
  showTyping();

  try {
    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [
          {
            role: 'system',
            content: 'Du bist Nova, ein persönlicher KI-Assistent von Zentra AI. Du bist intelligent, präzise und technisch. Du antwortest auf Deutsch. Dein Slogan ist: Nova. Kennt dich. Vergisst nie.'
          },
          ...conversationHistory
        ],
        max_tokens: 1024,
        temperature: 0.7
      })
    });

    const data = await response.json();
    removeTyping();

    if (data.choices && data.choices[0]) {
      const reply = data.choices[0].message.content;
      conversationHistory.push({ role: 'assistant', content: reply });
      setNovaState('speaking');
      addMessage('nova', reply);
      setTimeout(() => setNovaState('ready'), 2000);
    } else {
      setNovaState('ready');
      addMessage('nova', 'Fehler: ' + (data.error?.message || 'Unbekannter Fehler'));
    }
  } catch (err) {
    removeTyping();
    setNovaState('ready');
    addMessage('nova', 'Verbindungsfehler. Bitte prüfe deinen API Key.');
  }

  isTyping = false;
  if (msgCount < MAX_MESSAGES) {
    document.getElementById('send-btn').disabled = false;
  }
}

// ===== STARFIELD BACKGROUND =====
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let stars = [];

function resizeBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}

function initStars() {
  stars = [];
  for (let i = 0; i < 180; i++) {
    stars.push({
      x: Math.random() * bgCanvas.width,
      y: Math.random() * bgCanvas.height,
      r: Math.random() * 1.2 + 0.2,
      o: Math.random() * 0.6 + 0.05,
      speed: Math.random() * 0.3 + 0.05,
      dir: Math.random() > 0.5 ? 1 : -1
    });
  }
}

function drawBg() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  stars.forEach(s => {
    bgCtx.beginPath();
    bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    bgCtx.fillStyle = `rgba(180,220,255,${s.o})`;
    bgCtx.fill();
    s.o += s.speed * 0.008 * s.dir;
    if (s.o > 0.8) s.dir = -1;
    if (s.o < 0.05) s.dir = 1;
  });
  requestAnimationFrame(drawBg);
}

window.addEventListener('resize', () => { resizeBg(); initStars(); });
resizeBg(); initStars(); drawBg();

// ===== ORBITAL RING =====
const ringCanvas = document.getElementById('ring-canvas');
const rCtx = ringCanvas.getContext('2d');

// Orbiters config
const orbiters = [
  { radius: 0.88, speed: 0.006, angle: 0.8,    size: 5, color: '#f59e0b', glow: 'rgba(245,158,11,0.6)' },
  { radius: 0.70, speed: 0.010, angle: 3.2,    size: 4, color: '#00e5ff', glow: 'rgba(0,229,255,0.6)' },
  { radius: 0.88, speed: 0.008, angle: 2.1,    size: 3, color: '#8b5cf6', glow: 'rgba(139,92,246,0.6)' },
  { radius: 0.70, speed: 0.007, angle: 5.0,    size: 3, color: '#10b981', glow: 'rgba(16,185,129,0.6)' },
];

// Audio wave bars
let wavePhase = 0;

function drawRing() {
  const W = ringCanvas.width;
  const H = ringCanvas.height;
  const cx = W / 2;
  const cy = H / 2;
  const maxR = Math.min(W, H) / 2 - 10;

  rCtx.clearRect(0, 0, W, H);

  // Main ring
  const ringR = maxR * 0.88;

  // Outer glow ring
  rCtx.beginPath();
  rCtx.arc(cx, cy, ringR + 3, 0, Math.PI * 2);
  rCtx.strokeStyle = 'rgba(0,200,255,0.04)';
  rCtx.lineWidth = 8;
  rCtx.stroke();

  // Main ring stroke
  rCtx.beginPath();
  rCtx.arc(cx, cy, ringR, 0, Math.PI * 2);
  rCtx.strokeStyle = isSpeaking
    ? 'rgba(0,229,255,0.35)'
    : 'rgba(0,200,255,0.18)';
  rCtx.lineWidth = 1;
  rCtx.stroke();

  // Inner ring
  const innerR = maxR * 0.70;
  rCtx.beginPath();
  rCtx.arc(cx, cy, innerR, 0, Math.PI * 2);
  rCtx.strokeStyle = 'rgba(0,200,255,0.08)';
  rCtx.lineWidth = 0.5;
  rCtx.stroke();

  // Center core
  const coreR = maxR * 0.20;

  // Core glow
  const coreGrad = rCtx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 2);
  coreGrad.addColorStop(0, isSpeaking ? 'rgba(0,229,255,0.15)' : 'rgba(0,150,255,0.10)');
  coreGrad.addColorStop(1, 'transparent');
  rCtx.fillStyle = coreGrad;
  rCtx.beginPath();
  rCtx.arc(cx, cy, coreR * 2, 0, Math.PI * 2);
  rCtx.fill();

  // Audio waves when speaking
  if (isSpeaking) {
    wavePhase += 0.12;
    const bars = 12;
    const barW = 3;
    const maxH = coreR * 0.7;
    const spread = coreR * 1.1;
    for (let i = 0; i < bars; i++) {
      const t = i / (bars - 1);
      const x = cx - spread + t * spread * 2;
      const h = maxH * (0.3 + 0.7 * Math.abs(Math.sin(wavePhase + i * 0.7)));
      const alpha = 0.4 + 0.5 * Math.abs(Math.sin(wavePhase + i * 0.5));
      rCtx.fillStyle = `rgba(0,229,255,${alpha})`;
      rCtx.beginPath();
      rCtx.roundRect
        ? rCtx.roundRect(x - barW/2, cy - h/2, barW, h, 1.5)
        : rCtx.rect(x - barW/2, cy - h/2, barW, h);
      rCtx.fill();
    }
  } else {
    // Center dot
    rCtx.beginPath();
    rCtx.arc(cx, cy, 4, 0, Math.PI * 2);
    rCtx.fillStyle = 'rgba(0,200,255,0.6)';
    rCtx.fill();
    rCtx.beginPath();
    rCtx.arc(cx, cy, 2, 0, Math.PI * 2);
    rCtx.fillStyle = 'rgba(180,230,255,0.9)';
    rCtx.fill();
  }

  // Orbiters
  const speedMult = isTyping ? 2.5 : 1;
  orbiters.forEach(o => {
    o.angle += o.speed * speedMult;
    const r = maxR * o.radius;
    const ox = cx + Math.cos(o.angle) * r;
    const oy = cy + Math.sin(o.angle) * r;

    // Glow
    const g = rCtx.createRadialGradient(ox, oy, 0, ox, oy, o.size * 3);
    g.addColorStop(0, o.glow);
    g.addColorStop(1, 'transparent');
    rCtx.fillStyle = g;
    rCtx.beginPath();
    rCtx.arc(ox, oy, o.size * 3, 0, Math.PI * 2);
    rCtx.fill();

    // Core dot
    rCtx.beginPath();
    rCtx.arc(ox, oy, o.size, 0, Math.PI * 2);
    rCtx.fillStyle = o.color;
    rCtx.fill();
  });

  requestAnimationFrame(drawRing);
}

function resizeRing() {
  const container = document.getElementById('ring-container');
  const size = container.offsetWidth;
  ringCanvas.width = size;
  ringCanvas.height = size;
}

window.addEventListener('resize', resizeRing);
resizeRing();
drawRing();
</script>
