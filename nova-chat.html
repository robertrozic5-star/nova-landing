<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova – Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #00aaff;
    --blue-dim: #0066aa;
    --blue-dark: rgba(0,100,180,0.15);
    --white: #e8f4ff;
    --bg: #000508;
    --msg-bg: rgba(0,20,40,0.7);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Exo 2', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid rgba(0,170,255,0.15);
    background: rgba(0,5,10,0.9);
    backdrop-filter: blur(10px);
    z-index: 10;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-logo {
    width: 36px;
    height: 36px;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(0,170,255,0.5));
  }

  .header-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--white);
  }

  .header-title span { color: var(--blue); }

  .msg-counter {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    color: rgba(200,230,255,0.4);
    letter-spacing: 0.1em;
  }

  .msg-counter.warning { color: #ffaa00; }
  .msg-counter.critical { color: #ff4444; }

  /* SETUP BANNER */
  #setup-banner {
    background: rgba(0,80,150,0.3);
    border-bottom: 1px solid rgba(0,170,255,0.2);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.85rem;
    color: rgba(200,230,255,0.8);
  }

  #setup-banner input {
    flex: 1;
    background: rgba(0,20,40,0.8);
    border: 1px solid rgba(0,170,255,0.3);
    color: var(--white);
    padding: 8px 14px;
    font-family: 'Exo 2', sans-serif;
    font-size: 0.85rem;
    outline: none;
    letter-spacing: 0.05em;
  }

  #setup-banner input:focus { border-color: var(--blue); }

  #setup-banner button {
    background: var(--blue);
    border: none;
    color: #000;
    padding: 8px 18px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  #setup-banner button:hover { opacity: 0.85; }

  /* CHAT AREA */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: rgba(0,170,255,0.2); }

  /* MESSAGES */
  .msg {
    display: flex;
    gap: 12px;
    max-width: 780px;
    animation: msgIn 0.3s ease;
  }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.nova { align-self: flex-start; }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 4px;
  }

  .msg.user .msg-avatar {
    background: rgba(0,100,180,0.3);
    border: 1px solid rgba(0,170,255,0.3);
    color: var(--blue);
  }

  .msg.nova .msg-avatar {
    background: transparent;
    border: none;
    padding: 0;
  }

  .msg.nova .msg-avatar img {
    width: 32px;
    height: 32px;
    object-fit: contain;
    filter: drop-shadow(0 0 6px rgba(0,170,255,0.4));
  }

  .msg-bubble {
    padding: 12px 18px;
    line-height: 1.6;
    font-size: 0.92rem;
    font-weight: 300;
    max-width: 100%;
  }

  .msg.user .msg-bubble {
    background: rgba(0,100,180,0.2);
    border: 1px solid rgba(0,170,255,0.2);
    color: var(--white);
    border-radius: 2px;
  }

  .msg.nova .msg-bubble {
    background: var(--msg-bg);
    border: 1px solid rgba(0,170,255,0.1);
    border-left: 2px solid var(--blue);
    color: rgba(220,240,255,0.9);
    border-radius: 0 2px 2px 0;
  }

  /* TYPING INDICATOR */
  .typing-dots {
    display: flex;
    gap: 5px;
    padding: 4px 0;
    align-items: center;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    background: var(--blue);
    border-radius: 50%;
    animation: dot 1.2s infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  /* WELCOME */
  .welcome {
    text-align: center;
    padding: 60px 20px;
    opacity: 0.6;
  }

  .welcome-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.2rem;
    color: var(--blue);
    letter-spacing: 0.15em;
    margin-bottom: 8px;
  }

  .welcome-sub {
    font-size: 0.85rem;
    color: rgba(200,230,255,0.5);
    font-weight: 300;
  }

  /* INPUT AREA */
  footer {
    padding: 16px 24px;
    border-top: 1px solid rgba(0,170,255,0.15);
    background: rgba(0,5,10,0.9);
    backdrop-filter: blur(10px);
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #input {
    flex: 1;
    background: rgba(0,20,40,0.8);
    border: 1px solid rgba(0,170,255,0.2);
    color: var(--white);
    padding: 12px 18px;
    font-family: 'Exo 2', sans-serif;
    font-size: 0.92rem;
    font-weight: 300;
    resize: none;
    outline: none;
    min-height: 48px;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }

  #input:focus { border-color: var(--blue); }
  #input::placeholder { color: rgba(200,230,255,0.25); }

  #send-btn {
    background: transparent;
    border: 1.5px solid var(--blue);
    color: var(--blue);
    width: 48px;
    height: 48px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  #send-btn:hover { background: var(--blue); color: #000; }
  #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  #send-btn svg { width: 18px; height: 18px; }

  .limit-msg {
    text-align: center;
    padding: 16px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    color: #ffaa00;
    letter-spacing: 0.1em;
    display: none;
  }

  /* ANIMATIONS */
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes dot {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* STARS */
  #stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  header, #setup-banner, #chat, footer { position: relative; z-index: 1; }
</style>
</head>

  // State
  const MAX_MESSAGES = 10;
  let apiKey = localStorage.getItem('nova_groq_key') || '';
  let msgCount = getCount();
  let isTyping = false;
  let conversationHistory = [];

  // Init
  document.getElementById('api-key-input').value = apiKey;
  if (apiKey) document.getElementById('setup-banner').style.display = 'none';
  updateCounter();

  // Auto-resize textarea
  const input = document.getElementById('input');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function saveKey() {
    const key = document.getElementById('api-key-input').value.trim();
    if (!key) return;
    apiKey = key;
    localStorage.setItem('nova_groq_key', key);
    document.getElementById('setup-banner').style.display = 'none';
  }

  function getCount() {
    const today = new Date().toDateString();
    const stored = JSON.parse(localStorage.getItem('nova_count') || '{"date":"","count":0}');
    if (stored.date !== today) {
      localStorage.setItem('nova_count', JSON.stringify({date: today, count: 0}));
      return 0;
    }
    return stored.count;
  }

  function incrementCount() {
    const today = new Date().toDateString();
    msgCount++;
    localStorage.setItem('nova_count', JSON.stringify({date: today, count: msgCount}));
    updateCounter();
  }

  function updateCounter() {
    const remaining = MAX_MESSAGES - msgCount;
    const el = document.getElementById('counter');
    el.textContent = `${remaining} / ${MAX_MESSAGES} Nachrichten heute`;
    el.className = 'msg-counter';
    if (remaining <= 3) el.classList.add('warning');
    if (remaining <= 0) el.classList.add('critical');

    if (remaining <= 0) {
      document.getElementById('send-btn').disabled = true;
      document.getElementById('input').disabled = true;
      document.getElementById('limit-msg').style.display = 'block';
    }
  }

  function addMessage(role, text) {
    const chat = document.getElementById('chat');

    // Remove welcome screen
    const welcome = chat.querySelector('.welcome');
    if (welcome) welcome.remove();

    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';

    if (role === 'nova') {
      avatar.innerHTML = `<img src="${document.getElementById('nova-logo').src}" alt="Nova">`;
    } else {
      avatar.textContent = 'DU';
    }

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;

    return bubble;
  }

  function showTyping() {
    const chat = document.getElementById('chat');
    const msg = document.createElement('div');
    msg.className = 'msg nova';
    msg.id = 'typing-indicator';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.innerHTML = `<img src="${document.getElementById('nova-logo').src}" alt="Nova">`;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || isTyping) return;

    if (!apiKey) {
      document.getElementById('setup-banner').style.display = 'flex';
      document.getElementById('api-key-input').focus();
      return;
    }

    if (msgCount >= MAX_MESSAGES) return;

    input.value = '';
    input.style.height = 'auto';
    isTyping = true;
    document.getElementById('send-btn').disabled = true;

    addMessage('user', text);
    incrementCount();

    conversationHistory.push({ role: 'user', content: text });

    showTyping();

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: 'llama3-8b-8192',
          messages: [
            {
              role: 'system',
              content: 'Du bist Nova, ein persönlicher KI-Assistent von Zentra AI. Du bist intelligent, präzise und technisch. Du antwortest auf Deutsch. Dein Slogan ist: Nova. Kennt dich. Vergisst nie.'
            },
            ...conversationHistory
          ],
          max_tokens: 1024,
          temperature: 0.7
        })
      });

      const data = await response.json();
      removeTyping();

      if (data.choices && data.choices[0]) {
        const reply = data.choices[0].message.content;
        conversationHistory.push({ role: 'assistant', content: reply });
        addMessage('nova', reply);
      } else {
        addMessage('nova', 'Fehler: ' + (data.error?.message || 'Unbekannter Fehler'));
      }

    } catch (err) {
      removeTyping();
      addMessage('nova', 'Verbindungsfehler. Bitte prüfe deinen API Key.');
    }

    isTyping = false;
    if (msgCount < MAX_MESSAGES) {
      document.getElementById('send-btn').disabled = false;
    }
  }

  // Starfield
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.1 + 0.2,
        o: Math.random() * 0.5 + 0.1,
        speed: Math.random() * 0.3 + 0.05
      });
    }
  }

  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180,220,255,${s.o})`;
      ctx.fill();
      s.o += s.speed * 0.01;
      if (s.o > 0.7 || s.o < 0.1) s.speed *= -1;
    });
    requestAnimationFrame(drawStars);
  }

  window.addEventListener('resize', () => { resize(); initStars(); });
  resize();
  initStars();
  drawStars();
</script>
